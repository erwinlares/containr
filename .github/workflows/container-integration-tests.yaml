# Runs containr's Layer 3 integration tests -- the ones that actually
# call system2() against a real container tool, rather than a mocked one.
# See on-testing.md for the full three-layer testing strategy.
#
# These tests are gated behind CONTAINR_INTEGRATION_TESTS=true and are
# never run by R-CMD-check.yaml, so before this workflow existed, the
# real build_image()/list_images() system2() calls had no automated
# coverage at all -- only ever exercised manually, by hand, on a
# developer's own machine.
#
# push_image()'s Layer 3 test is deliberately NOT exercised here. It
# additionally requires CONTAINR_TEST_NAMESPACE and CONTAINR_TEST_PROJECT
# to be set (see test-container-workflow.R), which are intentionally left
# unset in this workflow -- that test needs a live registry login and
# pushes a real (if throwaway) image to a real destination on every run,
# which is a separate operational decision (managing a credential in this
# repo's secrets, accepting a live external side effect on every push)
# from the build-only coverage this workflow adds. Revisit separately if
# that tradeoff is ever worth making.
#
# Runs on ubuntu-latest, which is natively x86_64 -- this also means
# build_image()'s tests never need cross-platform emulation (the QEMU
# problem from Session 4 doesn't apply here, since there's no
# architecture mismatch to cross-compile for).
on:
  push:
    branches: [main, master]
    paths:
      - "R/build-image.R"
      - "R/push-image.R"
      - "R/list-images.R"
      - "R/container-helpers.R"
      - "tests/testthat/test-container-workflow.R"
      - ".github/workflows/container-integration-tests.yaml"
  pull_request:
    paths:
      - "R/build-image.R"
      - "R/push-image.R"
      - "R/list-images.R"
      - "R/container-helpers.R"
      - "tests/testthat/test-container-workflow.R"
      - ".github/workflows/container-integration-tests.yaml"
  workflow_dispatch:

name: container-integration-tests.yaml

permissions: read-all

jobs:
  container-integration-tests:
    runs-on: ubuntu-latest

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      CONTAINR_INTEGRATION_TESTS: "true"

    steps:
      - uses: actions/checkout@v4

      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman
          podman --version
          podman info

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::devtools
          needs: check

      - name: Run Layer 3 integration tests
        run: |
          # devtools::test() alone does NOT exit non-zero on test failure --
          # verified directly (a deliberately failing test still produced
          # exit status 0) before writing this workflow, since a CI step
          # that silently passes regardless of test outcome would defeat
          # the entire purpose of adding this workflow. Explicitly checking
          # the results and quitting non-zero is what actually makes this
          # step fail the job when a test fails.
          results <- devtools::test(".", reporter = "summary")
          df <- as.data.frame(results)
          n_failed <- sum(df$failed)
          n_error  <- sum(df$error)
          cat("\nfailed:", n_failed, " errors:", n_error, "\n")
          if (n_failed > 0 || n_error > 0) {
              quit(status = 1, save = "no")
          }
        shell: Rscript {0}
